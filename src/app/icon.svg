<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#brandGradient)" />
  
  <!-- Outer Tech Rings -->
  <circle cx="256" cy="256" r="170" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="12 12" fill="none" />
  <circle cx="256" cy="256" r="120" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" fill="none" />
  
  <!-- AI Sparkle Core -->
  <path d="M256 110 C256 200, 200 256, 110 256 C200 256, 256 312, 256 402 C256 312, 312 256, 402 256 C312 256, 256 200, 256 110 Z" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Inner Detail -->
  <circle cx="256" cy="256" r="26" fill="url(#brandGradient)" opacity="0.95" />
</svg>